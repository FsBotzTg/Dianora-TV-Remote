<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dianora TV Remote</title>
<style>
:root {
  --ink: #0d0f16;
  --panel: #151a2a;
  --key: #1c2233;
  --raised: #283147;
  --signal: #22e6ff;
  --signal-glow: rgba(34, 230, 255, 0.4);
  --red: #ff4757;
  --red-glow: rgba(255, 71, 87, 0.45);
  --text: #e8ecf5;
  --muted: #7b849c;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  height: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at 50% 0%, #1c253c 0%, var(--ink) 70%);
  padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
  display: flex;
  justify-content: center;
}

main {
  width: 100%;
  max-width: 390px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
}

/* Header & Status Indicator */
header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 6px;
}

.brand {
  display: flex;
  flex-direction: column;
}

h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.8px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 6px;
}

h1 span {
  color: var(--signal);
}

.subtitle {
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.4px;
}

.status-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.05);
  padding: 5px 10px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  cursor: pointer;
  transition: background 0.2s;
}

.status-pill:active {
  background: rgba(255, 255, 255, 0.12);
}

.dot {
  position: relative;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--signal);
}

.dot::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 1.5px solid var(--signal);
  opacity: 0;
}

.dot.fire::after {
  animation: ripple 0.45s ease-out;
}

@keyframes ripple {
  from { transform: scale(1); opacity: 0.8; }
  to { transform: scale(4); opacity: 0; }
}

#status {
  font-size: 11px;
  font-weight: 600;
  color: var(--signal);
}

/* Buttons Base */
.row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.btn {
  position: relative;
  border: 1px solid rgba(255, 255, 255, 0.07);
  background: linear-gradient(180deg, var(--raised) 0%, var(--key) 100%);
  color: var(--text);
  font-family: inherit;
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.08s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
}

.btn:active, .btn.on {
  transform: scale(0.93);
  border-color: var(--signal);
  box-shadow: 0 0 14px var(--signal-glow);
}

.btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Power Button */
.btn-pwr {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ff5e6d 0%, var(--red) 100%);
  border-color: rgba(255, 71, 87, 0.5);
  box-shadow: 0 4px 14px rgba(255, 71, 87, 0.35);
}

.btn-pwr:active, .btn-pwr.on {
  box-shadow: 0 0 18px var(--red-glow);
  border-color: #ffa3ab;
}

.btn-pwr svg {
  stroke: #ffffff;
  width: 22px;
  height: 22px;
  stroke-width: 2.5;
}

.btn-pill {
  height: 44px;
  padding: 0 18px;
  border-radius: 22px;
  font-size: 12px;
  letter-spacing: 0.3px;
}

/* Directional Pad (D-Pad) */
.dpad-container {
  position: relative;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: linear-gradient(180deg, #242c40 0%, #181d2a 100%);
  border: 1px solid rgba(34, 230, 255, 0.2);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.08);
}

.dpad-btn {
  position: absolute;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: none;
  border: none;
  box-shadow: none;
}

.dpad-btn:active, .dpad-btn.on {
  background: rgba(34, 230, 255, 0.15);
  box-shadow: none;
}

.dpad-btn svg {
  width: 28px;
  height: 28px;
  stroke-width: 2.4;
  color: var(--text);
}

.dpad-u { top: 6px; left: 68px; }
.dpad-d { bottom: 6px; left: 68px; }
.dpad-l { left: 6px; top: 68px; }
.dpad-r { right: 6px; top: 68px; }

.dpad-ok {
  position: absolute;
  left: 60px;
  top: 60px;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: linear-gradient(180deg, #17b3cb 0%, #0c8a9e 100%);
  color: #0b101b;
  font-weight: 900;
  font-size: 17px;
  border: 1px solid rgba(34, 230, 255, 0.5);
  box-shadow: 0 4px 12px rgba(12, 138, 158, 0.4);
}

.dpad-ok:active, .dpad-ok.on {
  box-shadow: 0 0 16px var(--signal-glow);
  transform: scale(0.92);
}

/* Navigation Grid */
.nav-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.nav-grid .btn {
  height: 52px;
  border-radius: 14px;
  flex-direction: column;
  gap: 3px;
  font-size: 10px;
  color: var(--muted);
}

.nav-grid .btn svg {
  color: var(--text);
  width: 18px;
  height: 18px;
}

/* Rockers and Colors Row */
.rocker-section {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
}

.rocker {
  width: 62px;
  height: 132px;
  border-radius: 31px;
  background: linear-gradient(180deg, var(--raised) 0%, var(--key) 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}

.rocker-btn {
  flex: 1;
  width: 100%;
  background: none;
  border: none;
  box-shadow: none;
  font-size: 20px;
  font-weight: 300;
  color: var(--text);
}

.rocker-btn:active, .rocker-btn.on {
  background: rgba(34, 230, 255, 0.18);
  box-shadow: none;
}

.rocker-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 0.5px;
}

.color-column {
  display: grid;
  grid-template-columns: repeat(2, 38px);
  gap: 12px;
}

.btn-color {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
}

.btn-red { background: linear-gradient(180deg, #ff6b6b 0%, #d63031 100%); box-shadow: 0 3px 8px rgba(214, 48, 49, 0.4); }
.btn-green { background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%); box-shadow: 0 3px 8px rgba(39, 174, 96, 0.4); }
.btn-yellow { background: linear-gradient(180deg, #f1c40f 0%, #e67e22 100%); box-shadow: 0 3px 8px rgba(230, 126, 34, 0.4); }
.btn-blue { background: linear-gradient(180deg, #3498db 0%, #2980b9 100%); box-shadow: 0 3px 8px rgba(41, 128, 185, 0.4); }

/* Numeric Keypad */
.numpad {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 0 16px;
}

.numpad .btn {
  height: 42px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
}

.numpad .btn-sm {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

/* Console & Log */
#console-log {
  width: 100%;
  text-align: center;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  color: var(--muted);
  min-height: 16px;
  padding-bottom: 8px;
}
</style>
</head>
<body>
<main>
  <!-- Top Navigation Bar -->
  <header>
    <div class="brand">
      <h1>Dianora<span>.</span></h1>
      <span class="subtitle">Smart TV Infrared Remote</span>
    </div>
    <div class="status-pill" id="status-badge" onclick="onStatusBadgeClick()" title="Tap to check IR hardware">
      <span class="dot" id="dot"></span>
      <span id="status">Connecting...</span>
    </div>
  </header>

  <!-- Power, Input & Mute -->
  <div class="row">
    <button class="btn btn-pwr" data-key="POWER" aria-label="Power">
      <svg viewBox="0 0 24 24"><path d="M7.5 5.5a8 8 0 1 0 9 0"/><path d="M12 3v8.5"/></svg>
    </button>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-pill" data-key="INPUT">Source</button>
      <button class="btn btn-pill" data-key="MUTE">Mute</button>
    </div>
  </div>

  <!-- Directional D-Pad -->
  <div class="dpad-container">
    <button class="btn dpad-btn dpad-u" data-key="UP" data-repeat aria-label="Up">
      <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <button class="btn dpad-btn dpad-d" data-key="DOWN" data-repeat aria-label="Down">
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="btn dpad-btn dpad-l" data-key="LEFT" data-repeat aria-label="Left">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button class="btn dpad-btn dpad-r" data-key="RIGHT" data-repeat aria-label="Right">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="btn dpad-ok" data-key="OK">OK</button>
  </div>

  <!-- Navigation Grid (Back, Home, Menu, Settings) -->
  <div class="nav-grid">
    <button class="btn" data-key="BACK">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      <span>Back</span>
    </button>
    <button class="btn" data-key="HOME">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></svg>
      <span>Home</span>
    </button>
    <button class="btn" data-key="MENU">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span>Menu</span>
    </button>
    <button class="btn" data-key="SETTINGS">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5" stroke-dasharray="3.2 2.6" stroke-width="3"/></svg>
      <span>Settings</span>
    </button>
  </div>

  <!-- Volume & Channel Rockers + Dedicated Color Functions -->
  <div class="rocker-section">
    <div class="rocker">
      <button class="btn rocker-btn" data-key="VOL_UP" data-repeat aria-label="Volume up">+</button>
      <span class="rocker-label">Vol</span>
      <button class="btn rocker-btn" data-key="VOL_DOWN" data-repeat aria-label="Volume down">&minus;</button>
    </div>

    <div class="color-column">
      <button class="btn btn-color btn-red" data-key="RED" aria-label="Red"></button>
      <button class="btn btn-color btn-green" data-key="GREEN" aria-label="Green"></button>
      <button class="btn btn-color btn-yellow" data-key="YELLOW" aria-label="Yellow"></button>
      <button class="btn btn-color btn-blue" data-key="BLUE" aria-label="Blue"></button>
    </div>

    <div class="rocker">
      <button class="btn rocker-btn" data-key="CH_UP" data-repeat aria-label="Channel up">+</button>
      <span class="rocker-label">Ch</span>
      <button class="btn rocker-btn" data-key="CH_DOWN" data-repeat aria-label="Channel down">&minus;</button>
    </div>
  </div>

  <!-- Numeric Pad (0-9, Info, Mouse) -->
  <div class="numpad">
    <button class="btn" data-key="1">1</button>
    <button class="btn" data-key="2">2</button>
    <button class="btn" data-key="3">3</button>
    <button class="btn" data-key="4">4</button>
    <button class="btn" data-key="5">5</button>
    <button class="btn" data-key="6">6</button>
    <button class="btn" data-key="7">7</button>
    <button class="btn" data-key="8">8</button>
    <button class="btn" data-key="9">9</button>
    <button class="btn btn-sm" data-key="INFO">Info</button>
    <button class="btn" data-key="0">0</button>
    <button class="btn btn-sm" data-key="MOUSE">Mouse</button>
  </div>

  <!-- Live Output Log -->
  <div id="console-log">Ready</div>
</main>

<script>
window.DianoraRemote = {
  dispatchKey(keyName) {
    if (window.Android && typeof window.Android.sendKey === "function") {
      return window.Android.sendKey(keyName);
    }
    console.log("[Simulation] Transmitted key:", keyName);
    return "Simulated: " + keyName;
  },

  setStatus(isReady, message) {
    const statusLabel = document.getElementById("status");
    const dot = document.getElementById("dot");
    statusLabel.textContent = message || (isReady ? "IR Ready (38 kHz)" : "No IR Blaster");
    const activeColor = isReady ? "var(--signal)" : "var(--red)";
    statusLabel.style.color = activeColor;
    dot.style.background = activeColor;
  }
};

const dotElement = document.getElementById("dot");
const consoleLog = document.getElementById("console-log");

function executeKey(keyName) {
  let resultMsg;
  try {
    resultMsg = window.DianoraRemote.dispatchKey(keyName);
  } catch (err) {
    resultMsg = "Error: " + err.message;
  }
  consoleLog.textContent = resultMsg;

  // Visual pulse on LED indicator
  dotElement.classList.remove("fire");
  void dotElement.offsetWidth;
  dotElement.classList.add("fire");
}

function onStatusBadgeClick() {
  if (window.Android && typeof window.Android.promptHardwareCheck === "function") {
    window.Android.promptHardwareCheck();
  }
}

// Attach Pointer Events for immediate response and hold-to-repeat
document.querySelectorAll("[data-key]").forEach(button => {
  const key = button.dataset.key;
  const isRepeatable = "repeat" in button.dataset;
  let repeatTimeout, repeatInterval, isPressed = false;

  const cancelPress = () => {
    clearTimeout(repeatTimeout);
    clearInterval(repeatInterval);
    button.classList.remove("on");
    isPressed = false;
  };

  button.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    isPressed = true;
    button.classList.add("on");

    if (isRepeatable) {
      executeKey(key);
      repeatTimeout = setTimeout(() => {
        repeatInterval = setInterval(() => executeKey(key), 120);
      }, 350);
    }
  });

  button.addEventListener("pointerup", (e) => {
    e.preventDefault();
    if (isPressed && !isRepeatable) {
      executeKey(key);
    }
    cancelPress();
  });

  ["pointercancel", "pointerleave"].forEach(evt => button.addEventListener(evt, cancelPress));
  button.addEventListener("contextmenu", e => e.preventDefault());
});

// Notify native Android layer that web DOM is loaded
window.addEventListener("DOMContentLoaded", () => {
  if (window.Android && typeof window.Android.checkStatus === "function") {
    window.Android.checkStatus();
  }
});
</script>
</body>
</html>
